name: Java release verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/java-release-verification.yml'
      - 'scripts/verify_java_release.py'
      - 'scripts/java_release_smoke.py'
      - 'lib/MATSim/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated source and original release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit/source audit/downloads audit/evidence
          cp -R lib/MATSim/. audit/source/
          gh release download v1.0.1-prepared --pattern UST-Toolkit-v1.0.1.zip --dir audit/downloads
          echo '17f8324a9fbe6152007f7c51c2c9f8ec94d061a247c3efef92c77c2e77b9da66  audit/downloads/UST-Toolkit-v1.0.1.zip' | sha256sum -c -
          unzip -q audit/downloads/UST-Toolkit-v1.0.1.zip -d audit/original
          java -version 2> audit/evidence/java-version.txt
          mvn --version > audit/evidence/maven-version.txt
      - name: Build supplied Java source with an empty Maven repository
        run: |
          set -o pipefail
          mvn -B -ntp -Dmaven.repo.local="$PWD/audit/m2" -f audit/source/pom.xml clean package 2>&1 | tee audit/evidence/maven-build.log
      - name: Compare application bytecode and inventory bundled files
        run: |
          python scripts/verify_java_release.py audit/original/UST-Toolkit-v1.0.1/lib/matsim-uam-5.0.0.jar audit/source/target/matsim-uam-5.0.0.jar audit/evidence
          mvn -B -ntp -Dmaven.repo.local="$PWD/audit/m2" -f audit/source/pom.xml dependency:tree -DoutputFile="$PWD/audit/evidence/dependency-tree.txt"
      - name: Install Python smoke-test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the original and rebuilt runtimes with synthetic inputs
        run: |
          python scripts/java_release_smoke.py audit/downloads/UST-Toolkit-v1.0.1.zip audit/source/target/matsim-uam-5.0.0.jar audit/smoke audit/evidence
      - name: Check recorded comparison results
        run: |
          python -c "import json; r=json.load(open('audit/evidence/java-comparison.json')); assert r['application_code_matches'] and not r['dependency_class_byte_differences'] and not r['missing_dependency_classes'] and not r['extra_dependency_classes'], r"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-release-verification
          path: audit/evidence/
          retention-days: 30

      - name: Preserve clean runtime for release preparation
        uses: actions/upload-artifact@v4
        with:
          name: clean-built-runtime
          path: audit/source/target/matsim-uam-5.0.0.jar
          retention-days: 7
